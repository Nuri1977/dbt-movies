dbt_movies:
  target: dev
  outputs:
    dev:
      type: databricks
      host: '{{ env_var("db-host-DBT Connection") }}'
      http_path: '{{ env_var("db-httppath-DBT Connection") }}'
      token: '{{ env_var("db-token-DBT Connection") }}'
      catalog: '{{ env_var("db-catalog-DBT Connection") }}'
      schema: '{{ env_var("db-schema-DBT Connection") }}'
      threads: 4
